app-id: io.github.cook0001.LinuxJagexLauncher
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21
command: linux-jagex-launcher

finish-args:
  # Display & Graphics Acceleration (OpenGL, Vulkan, Wayland & X11)
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --device=dri
  - --device=all # Required for physical gamepads and handheld controllers

  # Audio (PulseAudio / PipeWire)
  - --socket=pulseaudio

  # Network (OAuth 2.0 PKCE, client updates, CDN feeds)
  - --share=network

  # File Access for Launcher Data, RS3 Cache, and RuneLite/HDOS Settings
  - --filesystem=xdg-data/linux-jagex-launcher:create
  - --filesystem=xdg-config/linux-jagex-launcher:create
  - --filesystem=~/.runelite:create
  - --filesystem=~/.hdos:create
  - --filesystem=~/.jagex_launcher:create
  - --filesystem=~/.jagex_cache_32:create
  - --filesystem=~/Pictures/RuneScape:create

  # Desktop Integration, Feral GameMode & Notifications
  - --talk-name=org.freedesktop.portal.OpenURI
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=com.feralinteractive.GameMode

build-options:
  append-path: /usr/lib/sdk/openjdk21/bin
  env:
    JAVA_HOME: /usr/lib/sdk/openjdk21

modules:
  # OpenJDK 21 SDK Extension setup for runtime execution of RuneLite / HDOS
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  # GTK 2.0 Shared Module (Required by the official RS3 NXT bootstrap client)
  - shared-modules/gtk2/gtk2.json

  # OpenSSL 1.1.1 (Required by native RS3 NXT client on modern Linux runtimes)
  - name: openssl
    buildsystem: simple
    build-commands:
      - ./config --prefix=/app --openssldir=/app/ssl shared zlib
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install_sw
    sources:
      - type: git
        url: https://github.com/openssl/openssl.git
        tag: OpenSSL_1_1_1w
        commit: e04bd3433fd84e1861bf258ea37928d9845e6a86

  # Main Application module (sourced from pre-compiled public release archive)
  - name: linux-jagex-launcher
    buildsystem: simple
    build-commands:
      - install -Dm755 -d /app/bin
      - install -Dm755 -d /app/share/linux-jagex-launcher
      - cp -a app-bundle/. /app/share/linux-jagex-launcher/
      - chmod 755 /app/share/linux-jagex-launcher/linux-jagex-launcher
      - ln -sf /app/share/linux-jagex-launcher/linux-jagex-launcher /app/bin/linux-jagex-launcher
      # Install FreeDesktop Metadata and Icons
      - install -Dm644 io.github.cook0001.LinuxJagexLauncher.desktop /app/share/applications/io.github.cook0001.LinuxJagexLauncher.desktop
      - install -Dm644 io.github.cook0001.LinuxJagexLauncher.metainfo.xml /app/share/metainfo/io.github.cook0001.LinuxJagexLauncher.metainfo.xml
      - install -Dm644 icon-512.png /app/share/icons/hicolor/512x512/apps/io.github.cook0001.LinuxJagexLauncher.png
      - install -Dm644 icon-256.png /app/share/icons/hicolor/256x256/apps/io.github.cook0001.LinuxJagexLauncher.png
      - install -Dm644 icon-128.png /app/share/icons/hicolor/128x128/apps/io.github.cook0001.LinuxJagexLauncher.png
      - install -Dm644 icon-64.png /app/share/icons/hicolor/64x64/apps/io.github.cook0001.LinuxJagexLauncher.png
      - install -Dm644 icon-32.png /app/share/icons/hicolor/32x32/apps/io.github.cook0001.LinuxJagexLauncher.png
    sources:
      - type: archive
        url: https://github.com/cook0001/Linux-Jagex-Launcher/releases/download/v1.4.9/linux-jagex-launcher-1.4.9.tar.gz
        sha256: ec54b1b450abebbbe382e4b13136f8f67f882c991b32fba32bc501938fe5a5f7
        dest: app-bundle
        only-arches:
          - x86_64
      - type: file
        path: io.github.cook0001.LinuxJagexLauncher.desktop
      - type: file
        path: io.github.cook0001.LinuxJagexLauncher.metainfo.xml
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Linux-Jagex-Launcher/v1.4.9/resources/icons/512x512.png
        dest-filename: icon-512.png
        sha256: 1aad284f3e212e6a47ce2bbf33165957540bcd2fa8d38c5bbcea39ae75226cfe
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Linux-Jagex-Launcher/v1.4.9/resources/icons/256x256.png
        dest-filename: icon-256.png
        sha256: b8b8e0dd98d2888bbe79c47aa7f30a7256ebbbf5952e55a8d2b1df60dabe94e1
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Linux-Jagex-Launcher/v1.4.9/resources/icons/128x128.png
        dest-filename: icon-128.png
        sha256: 2b6f20ed6fd62028c6f82a65766486eddb90ac75a917dadead3fc4447e58a675
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Linux-Jagex-Launcher/v1.4.9/resources/icons/64x64.png
        dest-filename: icon-64.png
        sha256: 5f96eaa418d664ba6ae97cc77fd31bdceb16570fec6e824f0c87c5ae42823210
      - type: file
        url: https://raw.githubusercontent.com/cook0001/Linux-Jagex-Launcher/v1.4.9/resources/icons/32x32.png
        dest-filename: icon-32.png
        sha256: 139b977a41ea0b23354bdfd239b93e11737f996b44d656d9fef1ceb3bca1fc18
