name: ARM64 Feature / Compatibility Request
description: Suggest an ARM64 (aarch64) enhancement, hardware profile, or Box64/FEX-Emu improvement
title: "[ARM64 Feature]: "
labels: ["enhancement", "arm64"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve **Linux ARM64 (`aarch64`)** support, SBC hardware detection, or x86_64 client translation (Box64 / FEX-Emu)? Let us know below!
  - type: input
    id: target_hardware
    attributes:
      label: Target ARM64 Hardware / Distro (if applicable)
      description: e.g. Raspberry Pi 5, Apple Silicon (Asahi Linux 16K pages), Snapdragon X, Ampere
      placeholder: Raspberry Pi 5 / Ubuntu 24.04 arm64
  - type: textarea
    id: problem
    attributes:
      label: What ARM64 limitation or workflow gap does this solve?
      description: A clear and concise description of the issue or missing ARM64 integration.
      placeholder: On ARM64, RuneLite / Box64 / FEX-Emu currently...
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or Workarounds Tested
      description: Any custom launch wrappers, Box64 env vars, or packaging tweaks you've tried.
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add hardware specs, logs, benchmarks, or upstream links here.
